version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: softcompany-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: softcompany
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d softcompany"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    container_name: softcompany-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/softcompany
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: defaultSecretKeyForJWTTokenGeneration1234567890

volumes:
  pgdata: